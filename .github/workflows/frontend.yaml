name: frontend deployment

on:
 push:
  branches:
   - main 
  paths:
   - "SpendSense-FrontEnd/**"

jobs:
 deploy: 
  environment: Prod
  runs-on: ubuntu-latest

  steps:
   - uses: actions/checkout@v4

   - name: Setup Node
     uses: actions/setup-node@v4
     with:
      node-version: 22

   - name: Install dependencies
     run: |
      cd SpendSense-FrontEnd/SpendSense
      npm ci

   - name: Build frontend
     env:
      VITE_API_URL: ${{ vars.VITE_API_BASE_URL }}
     run: |
      cd SpendSense-FrontEnd/SpendSense
      npm run build

   - name: Configure AWS Credentials
     uses: aws-actions/configure-aws-credentials@v4
     with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ap-southeast-1

   - name: Upload build to S3
     run: |
      aws s3 sync SpendSense-FrontEnd/SpendSense/dist/ s3://${{ vars.SPENDCENTS_S3_BUCKET }} --delete
   
   - name: Invalidate CloudFront cache
     run: |
      aws cloudfront create-invalidation \
       --distribution-id ${{ vars.SPENDCENTS_CLOUDFRONT_DISTRIBUTION_ID }} \
       --paths "/*" 
